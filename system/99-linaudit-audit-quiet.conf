# LinAudit: workaround for a kernel AppArmor<->audit regression.
#
# Symptom (kernel ring buffer / dmesg flood):
#   audit: error in audit_log_subj_ctx
#   audit_panic: NN callbacks suppressed
#
# Cause: on some kernels (observed on 7.0.x Manjaro) audit_log_subj_ctx() fails
# to render the optional subj= label for AppArmor-*unconfined* tasks. Because the
# audit failure mode is PRINTK (the kernel default), every failure is logged to
# the ring buffer. The volume tracks audited-syscall volume 1:1 -- LinAudit's
# system-wide execve rule makes it constant. The audit *records* themselves are
# intact; only the cosmetic subj= field is missing.
#
# The normal silence switch is `auditctl -f 0` (failure mode = silent). On the
# affected kernels every auditctl AUDIT_SET is rejected ("error while processing
# parameters"; -f / -b / -r all fail), so the failure mode cannot be changed at
# runtime and `-f 0` cannot be placed in the rules file either (augenrules would
# fail to load). We therefore throttle the benign message at the printk layer:
# audit_panic() honors printk_ratelimit(), so a tight rate limit collapses the
# flood to near-zero.
#
# Scope of effect: this only throttles legacy printk_ratelimit() callers, NOT the
# per-callsite pr_*_ratelimited() users that most modern kernel code uses, so the
# collateral impact on other kernel logging is small.
#
# This is a mitigation, not a cure. The real fix is a kernel without the
# regression (where `auditctl -f 0` works again). Remove this file and run
# `sudo sysctl --system` once that is in place.
#
# Installed only on hosts that actually exhibit the defect (see install.sh /
# `linaudit doctor`); it is intentionally NOT applied unconditionally.
kernel.printk_ratelimit = 30
kernel.printk_ratelimit_burst = 1
